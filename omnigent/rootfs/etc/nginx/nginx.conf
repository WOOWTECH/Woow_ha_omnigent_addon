worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache-control: same as the sibling n8n addon — HTML/JS/CSS always
    # revalidated so the React SPA doesn't serve a stale bundle after an
    # addon upgrade under the same ingress path.
    #
    # CRITICAL: omnigent-server sends `content-type: text/javascript` (the
    # older spelling, not `application/javascript`) AND `cache-control:
    # public, max-age=31536000, immutable` on all bundle files. The
    # combination froze the browser onto pre-sed-patch bundles for a full
    # year and hid our HA-ingress fixes for hours. Match both spellings
    # here, AND `proxy_hide_header Cache-Control` in the location block
    # so our `add_header` actually replaces the upstream one rather than
    # stacking with it.
    map $sent_http_content_type $ingress_cache_control {
        default                    "";
        ~*text/html                "no-store";
        ~*(application|text)/(?:x-)?javascript "no-store";
        ~*text/css                 "no-store";
    }

    # HA Supervisor gives every addon a stable ingress path like
    # /api/hassio_ingress/<16-128 char slug>. Sanitise + capture into a
    # variable that sub_filter uses to rewrite absolute asset URLs.
    map $http_x_ingress_path $safe_ingress_path {
        default                                                  "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$"           $http_x_ingress_path;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Supervisor-only. Ingress traffic always comes from 172.30.32.2.
        allow 172.30.32.2;
        deny  all;

        # Also expose /health to the supervisor watchdog on the same port
        # so the addon's `watchdog:` URL Just Works.
        location = /health {
            allow all;
            proxy_pass http://127.0.0.1:8000/health;
        }

        # NOTE: no `location = / { return 302 ... }` here. Supervisor
        # strips `/api/hassio_ingress/<slug>` before proxying, so the
        # browser hitting `.../<slug>/` reaches us as `GET /` and we
        # must let that pass through to omnigent-server. Redirecting
        # to `$safe_ingress_path/` creates a loop
        # (ERR_TOO_MANY_REDIRECTS) because the browser then re-hits
        # the same URL.

        # Serve the ingress path-rewriting shim from a static file so the
        # sub_filter injection stays small (nginx would otherwise choke on
        # `$` characters embedded in inline JS regexes).
        location = /_ingress-shim.js {
            allow all;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
            alias /etc/nginx/ingress-shim.js;
        }

        # Everything else — React SPA + FastAPI backend + SSE stream +
        # runner WebSocket tunnel.
        location / {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;

            # sub_filter can't rewrite gzip'd response bodies, so tell
            # upstream not to compress. FastAPI/uvicorn respects an
            # empty Accept-Encoding by returning identity.
            proxy_set_header Accept-Encoding   "";

            # Rewrite absolute Location: headers from upstream so any
            # server-side 302 (`/login?return_to=…`, etc.) gets the
            # Ingress path prefixed. Handles both `Location: /foo` and
            # fully-qualified `Location: http://127.0.0.1:8000/foo`.
            proxy_redirect ~^/(.*) $safe_ingress_path/$1;
            proxy_redirect ~^http://127\.0\.0\.1:8000/(.*) $safe_ingress_path/$1;

            # WebSocket upgrade for /v1/runners/*/tunnel and /v1/sessions/*/stream (SSE).
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Strip upstream's immutable/max-age header before we add ours,
            # otherwise the browser sees BOTH and honours the more
            # permissive one → cache poisoning after any code change.
            proxy_hide_header Cache-Control;
            add_header Cache-Control $ingress_cache_control always;

            # React SPA emits root-absolute URLs (Vite build outputs
            # `<script src="/assets/…">` and `<link href="/assets/…">`).
            # `<base>` doesn't help those — they're already absolute — so
            # the shim JS can't intercept them either (it runs after the
            # parser has already 404'd on the asset). Rewrite in-flight
            # via sub_filter, then still inject the shim for runtime
            # fetch / XHR / WebSocket / pushState paths.
            #
            # sub_filter also patches two omnigent-specific auth-guard
            # functions inside the built JS bundles so the SPA stops
            # redirecting to unprefixed `/login` (Chrome forbids
            # monkey-patching Location.href, so we rewrite the source):
            #
            #   Y() thinks it's not on the login page when pathname is
            #   `/api/hassio_ingress/<slug>/login` (exact `===` check).
            #   Rewrite the equality to endsWith so ingress-prefixed
            #   paths still count as being on /login.
            #
            #   q(e) does `location.href=`${e}?return_to=${t}`` — `e` is
            #   a bare `/login` from the API. Prefix it with the ingress
            #   path at construction time.
            #
            # After both patches, the full auth flow stays inside the
            # ingress iframe: q() redirects to prefixed URL, Y() then
            # correctly identifies we're on login, form renders, post-
            # login `location.href=n` already carries the prefix from
            # the ?return_to param q() set.
            sub_filter_types text/html application/javascript;
            sub_filter_once off;
            sub_filter '<head>' '<head><base href="$safe_ingress_path/"><script>window.__INGRESS_PATH__="$safe_ingress_path";</script><script src="$safe_ingress_path/_ingress-shim.js"></script>';
            sub_filter 'src="/assets/' 'src="$safe_ingress_path/assets/';
            sub_filter 'href="/assets/' 'href="$safe_ingress_path/assets/';
            sub_filter 'from"/assets/'  'from"$safe_ingress_path/assets/';
            sub_filter 'from "/assets/' 'from "$safe_ingress_path/assets/';
            # NOTE: The two auth-guard patches (Y() equality check and
            # q(e) location.href write) can't live here — nginx parses
            # `${e}` in both search AND replacement strings as its own
            # variable syntax and refuses to load the config. Instead
            # those patches are applied to the bundle at container
            # build time via `sed` (see Dockerfile). If you need to
            # re-derive them, grep for `Auth-guard` in Dockerfile.
        }
    }
}
