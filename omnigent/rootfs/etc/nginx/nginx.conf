worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache-control: same as the sibling n8n addon — HTML/JS/CSS always
    # revalidated so the React SPA doesn't serve a stale bundle after an
    # addon upgrade under the same ingress path.
    map $sent_http_content_type $ingress_cache_control {
        default                    "";
        ~*text/html                "no-store";
        ~*application/javascript   "no-store";
        ~*text/css                 "no-store";
    }

    # HA Supervisor gives every addon a stable ingress path like
    # /api/hassio_ingress/<16-128 char slug>. Sanitise + capture into a
    # variable that sub_filter uses to rewrite absolute asset URLs.
    map $http_x_ingress_path $safe_ingress_path {
        default                                                  "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]{16,128}$"           $http_x_ingress_path;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Supervisor-only. Ingress traffic always comes from 172.30.32.2.
        allow 172.30.32.2;
        deny  all;

        # Also expose /health to the supervisor watchdog on the same port
        # so the addon's `watchdog:` URL Just Works.
        location = /health {
            allow all;
            proxy_pass http://127.0.0.1:8000/health;
        }

        location = / {
            return 302 $safe_ingress_path/;
        }

        # Everything else — React SPA + FastAPI backend + SSE stream +
        # runner WebSocket tunnel.
        location / {
            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Ingress-Path    $http_x_ingress_path;

            # WebSocket upgrade for /v1/runners/*/tunnel and /v1/sessions/*/stream (SSE).
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header Cache-Control $ingress_cache_control always;

            # React SPA emits root-absolute URLs at runtime. Inject a <base>
            # tag + a tiny JS shim that patches fetch / XHR / WebSocket /
            # history.pushState so they always prepend the ingress path,
            # same trick as the n8n addon's Vue equivalent.
            sub_filter_types text/html;
            sub_filter_once on;
            sub_filter '<head>' '<head><base href="$safe_ingress_path/"><script>(function(p){if(!p)return;var A=window.HTMLAnchorElement;var f=window.fetch;window.fetch=function(i,init){if(typeof i==="string"&&i.startsWith("/")&&!i.startsWith(p+"/")&&!i.startsWith("//")){i=p+i;}return f.call(this,i,init);};var XO=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(typeof u==="string"&&u.startsWith("/")&&!u.startsWith(p+"/")&&!u.startsWith("//")){u=p+u;}return XO.apply(this,[m,u].concat([].slice.call(arguments,2)));};var HP=history.pushState,HR=history.replaceState;history.pushState=function(s,t,u){if(typeof u==="string"&&u.startsWith("/")&&!u.startsWith(p+"/")){u=p+u;}return HP.apply(this,[s,t,u]);};history.replaceState=function(s,t,u){if(typeof u==="string"&&u.startsWith("/")&&!u.startsWith(p+"/")){u=p+u;}return HR.apply(this,[s,t,u]);};var W=window.WebSocket;window.WebSocket=function(u,pr){if(typeof u==="string"){var m=u.match(/^(wss?:\/\/[^\/]+)(\/.*)$/);if(m&&m[2].startsWith("/")&&!m[2].startsWith(p+"/")){u=m[1]+p+m[2];}}return pr?new W(u,pr):new W(u);};})("$safe_ingress_path");</script>';
        }
    }
}
