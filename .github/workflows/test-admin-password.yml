name: Test admin password gate

# Offline shell test of omnigent/rootfs/etc/s6-overlay/s6-rc.d/init-addon-config/run:
# an empty admin password stops the add-on, no shipped file carries a default, and a
# pre-fix copy of the script must fail the same cases. No network, no secrets.
# It is a separate workflow so the publish workflow's required check names stay as they are.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "omnigent/**"
      - ".github/workflows/test-admin-password.yml"
  workflow_dispatch:

concurrency:
  group: test-admin-password-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: admin password gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the test
        run: sh omnigent/tests/test-admin-password.sh
