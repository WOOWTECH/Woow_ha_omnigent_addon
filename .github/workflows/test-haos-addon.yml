name: Test real HAOS add-on acceptance

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: haos-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  haos:
    name: HAOS acceptance (amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: omnigent/tests
      HAOS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the disposable guest and browser tools
        run: |
          set -euo pipefail
          # Missing KVM is a failure, never a skipped acceptance result.
          test -c /dev/kvm
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf nginx openssl dosfstools mtools acl
          sudo systemctl stop nginx
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          python -m pip install -r omnigent/tests/haos/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate the acceptance harness
        run: python -m unittest discover -s omnigent/tests -p 'test_haos_harness.py' -v
      - name: Boot fresh HAOS and exercise the actual Supervisor
        env:
          GH_TOKEN: ${{ github.token }}
          HAOS_REPORT_DIR: ${{ runner.temp }}/haos-report
        run: timeout --signal=TERM --kill-after=30s 50m python -m haos.acceptance
      - name: Upload only the sanitized acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: haos-acceptance-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/haos-report/haos-acceptance.json
          if-no-files-found: warn
          retention-days: 7
