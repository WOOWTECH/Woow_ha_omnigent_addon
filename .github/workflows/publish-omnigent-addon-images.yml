name: Publish omnigent add-on images

# Pull requests: check the manifest and build both images without pushing; the
# amd64 image is also started once (`omnigent --version`). Check names are
# fixed (`build (amd64)`, `build (aarch64)`, `Upgrade comparison / compare`) so
# they can be required checks.
#
# main: a version's images are immutable. When ghcr.io already has the
# config.yaml version for an architecture, that image is reused, not rebuilt or
# re-pushed (same as Woow_ha_odoo release.yml). Only the version tag is pushed;
# there is no `latest` tag (Supervisor pulls `image:` at the config.yaml version).
# To ship a change, bump config.yaml's version.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "omnigent/**"
      - ".github/workflows/publish-omnigent-addon-images.yml"
  workflow_dispatch:

concurrency:
  group: publish-omnigent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/hassio-addons/base/amd64:20.2.0
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/hassio-addons/base/aarch64:20.2.0
    env:
      IMAGE: ghcr.io/woowtech/woow-ha-omnigent-${{ matrix.arch }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest
        id: v
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for key in name version slug image arch; do
            [ "$(yq -r ".${key} // \"\"" omnigent/config.yaml)" != "" ] || { echo "::error::omnigent/config.yaml has no ${key}"; exit 1; }
          done
          [ "$(yq -r '.image' omnigent/config.yaml)" = 'ghcr.io/woowtech/woow-ha-omnigent-{arch}' ] \
            || { echo "::error::omnigent/config.yaml image is not ghcr.io/woowtech/woow-ha-omnigent-{arch}"; exit 1; }
          yq -e ".arch[] | select(. == \"${ARCH}\")" omnigent/config.yaml >/dev/null \
            || { echo "::error::omnigent/config.yaml does not list ${ARCH}"; exit 1; }
          echo "version=$(yq -r '.version' omnigent/config.yaml)" >> "$GITHUB_OUTPUT"

      - name: Reuse an image that is already published
        id: existing
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} already exists; reusing it (not rebuilt, not pushed)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "${IMAGE}:${VERSION} not published yet; will build and push"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.existing.outputs.exists != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.exists != 'true'

      - name: Log in to GHCR
        if: env.PUBLISH == 'true' && steps.existing.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (${{ matrix.arch }})
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./omnigent
          file: ./omnigent/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' && matrix.arch == 'amd64' }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=omnigent-${{ matrix.arch }}
          cache-to: type=gha,scope=omnigent-${{ matrix.arch }},mode=max

      - name: Test the amd64 image
        if: env.PUBLISH != 'true' && matrix.arch == 'amd64'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE}:${VERSION}" \
            --format '{{ index .Config.Labels "io.hass.version" }}' | grep -Fx "${VERSION}"
          docker run --rm --entrypoint omnigent "${IMAGE}:${VERSION}" --version

      # The SBOM of this image is what the Upgrade comparison scans as the
      # new version (pipeline #89, vulnerability comparison): pinned Syft from
      # the Store, uploaded as the artifact the comparison waits for (name: see
      # the Store addon-sbom action).
      - name: SBOM for the upgrade comparison
        if: github.event_name == 'pull_request' && matrix.arch == 'amd64'
        # TODO: switch to @main after WOOWTECH/Woow_HA_App_Store#72 merges.
        uses: WOOWTECH/Woow_HA_App_Store/.github/actions/addon-sbom@feat/89-upgrade-comparison
        with:
          component: woow-omnigent
          image: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}

  # Upgrade comparison (pipeline #89): rules and caller contract are in the Store
  # workflow header and Store README "升版比對與 `upgrade-notes.yaml`". The PR build
  # starts from main's gha cache when one exists (entries unused for 7 days are
  # evicted, and main skips the build once the version's image exists), so
  # unchanged layers match main's; for the layers the PR rebuilds, the PR's SBOM
  # may differ from the image main builds and releases for this version.
  upgrade-comparison:
    name: Upgrade comparison
    permissions:
      contents: read
      actions: read
    # TODO: switch to @main and drop tooling_ref after WOOWTECH/Woow_HA_App_Store#72 merges.
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-upgrade-check.yml@feat/89-upgrade-comparison
    with:
      # TODO: drop after WOOWTECH/Woow_HA_App_Store#72 merges (default is main).
      tooling_ref: feat/89-upgrade-comparison
      sbom_artifact: upgrade-comparison-sbom-*

  # The App Store ships only published Releases (registry ref_policy: release).
  # After the checks above pass on main, the Store's shared workflow publishes
  # the Release for a config.yaml version that has none yet.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: WOOWTECH/Woow_HA_App_Store/.github/workflows/woow-addon-release.yml@main
